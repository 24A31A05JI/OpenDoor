kind = "web"
previewPath = "/"
title = "Opportunity Hub"
description = "A polished opportunity discovery platform for students and early-career professionals to find competitions, internships, jobs, hackathons, and learning opportunities in one place."
version = "1.0.0"
id = "artifacts/opportunity-hub"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23573

[services.development]
run = "pnpm --filter @workspace/opportunity-hub run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/opportunity-hub", "run", "build" ]
serve = "static"
publicDir = "artifacts/opportunity-hub/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23573"
BASE_PATH = "/"
